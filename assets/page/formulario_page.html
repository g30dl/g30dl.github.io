    <div class="container" style="margin-top: 40px;">
        <section id="contacto">
            <h2>Formulario de Contacto</h2>
            <form id="contact-form" action="https://formsubmit.co/geodloo@espol.edu.ec" method="POST" novalidate>
                <input type="hidden" name="_subject" value="Nuevo mensaje desde tu CV">
                <input type="hidden" name="_captcha" value="false">
                <div class="form-group">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" required>
                    <span class="form-error" id="nombre-error"></span>
                </div>
                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required>
                    <span class="form-error" id="email-error"></span>
                </div>
                <div class="form-group">
                    <label for="asunto">Asunto:</label>
                    <input type="text" id="asunto" name="asunto" required>
                    <span class="form-error" id="asunto-error"></span>
                </div>
                <div class="form-group">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
                    <span class="form-error" id="mensaje-error"></span>
                </div>
                <button type="submit" id="submit-btn">Enviar Mensaje</button>
            </form>
        </section>

        <footer>
            <p id="footer-year">© 2025 - Página Curriculum Vitae Geovanny Diaz | ESPOL</p>
        </footer>
    </div>

    <script src="../js/script.js"></script>
